# ==================================================================
# Sitio del sistema de incidencias en el Apache de XAMPP
# ------------------------------------------------------------------
# Se activa agregando UNA linea al final de
#     C:\xampp\apache\conf\httpd.conf
# que diga:
#     Include "C:/incidencias/scripts/apache/incidencias.conf"
#
# Si instalaste el sistema en otra carpeta, cambia SOLO la linea Define
# de abajo (con barras /, no \) y la ruta del Include.
#
# Por que Apache y no `php artisan serve`: en Windows, artisan serve
# atiende UNA peticion a la vez. Si un docente espera una respuesta de la
# IA, que puede tardar hasta 30 segundos, todos los demas esperan detras.
# ==================================================================

Define INCIDENCIAS_RAIZ "C:/incidencias"

# No anunciar versiones. Las de Apache y PHP que trae XAMPP son de 2023;
# decirlas en cada respuesta le ahorra trabajo a quien busque una
# vulnerabilidad conocida. Afecta a todo el Apache de la PC, para bien.
ServerTokens Prod
ServerSignature Off

# Puerto propio, separado del 80 de XAMPP: el sistema no se mezcla con
# htdocs, y el tunel apunta solo aqui.
Listen 8080

<VirtualHost *:8080>
    ServerName localhost

    # Solo se publica la carpeta public/. El .env, el codigo y storage/
    # quedan fuera del alcance de la web aunque alguien adivine la ruta.
    DocumentRoot "${INCIDENCIAS_RAIZ}/public"

    <Directory "${INCIDENCIAS_RAIZ}/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ------------------------------------------------------------------
    # Las rutas globales de XAMPP, CERRADAS en este puerto.
    #
    # XAMPP define alias para todo el servidor —phpMyAdmin, php-cgi, los
    # scripts de ejemplo de cgi-bin— y esos alias responden tambien aqui.
    # XAMPP los protege con «solo desde esta PC» (Require local), pero todo
    # lo que entra por el tunel llega DESDE esta PC: con el tunel prendido,
    # phpMyAdmin quedaba abierto a internet, con root sin contrasena.
    #
    # Se cierran con mod_rewrite porque en este contexto se evalua ANTES
    # que los alias: la peticion no llega a resolverse. Y otra vez con
    # <Location>, por si alguien desactiva el rewrite.
    # ------------------------------------------------------------------
    RewriteEngine On
    RewriteRule "^/(phpmyadmin|php-cgi|cgi-bin|webdav|webalizer|licenses|manual|icons|error|server-status|server-info)(/|$)" - [R=404,NC,L]
    RewriteRule "^/~" - [R=404,L]

    <LocationMatch "(?i)^/(phpmyadmin|php-cgi|cgi-bin|webdav|webalizer|licenses|manual|icons|error|server-status|server-info)(/|$)">
        Require all denied
    </LocationMatch>

    <IfModule headers_module>
        Header always unset X-Powered-By
        Header unset X-Powered-By
    </IfModule>

    ErrorLog "logs/incidencias-error.log"
    CustomLog "logs/incidencias-acceso.log" combined
</VirtualHost>
