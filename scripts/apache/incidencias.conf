# ==================================================================
# Sitio del sistema de incidencias en el Apache de XAMPP
# ------------------------------------------------------------------
# Se activa agregando UNA linea al final de
#     C:\xampp\apache\conf\httpd.conf
# que diga:
#     Include "C:/incidencias/scripts/apache/incidencias.conf"
#
# Si instalaste el sistema en otra carpeta, cambia SOLO la linea Define
# de abajo (con barras /, no \) y la ruta del Include.
#
# Por que Apache y no `php artisan serve`: en Windows, artisan serve
# atiende UNA peticion a la vez. Si un docente espera una respuesta de la
# IA, que puede tardar hasta 30 segundos, todos los demas esperan detras.
# ==================================================================

Define INCIDENCIAS_RAIZ "C:/incidencias"

# Puerto propio, separado del 80 de XAMPP: el sistema no se mezcla con
# htdocs ni con phpMyAdmin, y el tunel apunta solo aqui.
Listen 8080

<VirtualHost *:8080>
    ServerName localhost

    # Solo se publica la carpeta public/. El .env, el codigo y storage/
    # quedan fuera del alcance de la web aunque alguien adivine la ruta.
    DocumentRoot "${INCIDENCIAS_RAIZ}/public"

    <Directory "${INCIDENCIAS_RAIZ}/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/incidencias-error.log"
    CustomLog "logs/incidencias-acceso.log" combined
</VirtualHost>
